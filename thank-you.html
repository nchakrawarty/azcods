<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="icon"
    type="image/x-icon"
    href="favicon.png"
  >

  <title>Thank You — AZCODS</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background: #05070a;
      color: #f5f7fa;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {

      width: min(650px, 100%);

      padding: 70px 45px;

      text-align: center;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius: 20px;

      background: #0b1017;

      box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);
    }

    .logo {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      font-size: 24px;

      font-weight: 900;

      margin-bottom: 45px;
    }

    .logo-mark {

      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #00ddff,
          #8b5cf6
        );
    }

    .logo span {

      color: #00ddff;

    }

    .check {

      width: 75px;
      height: 75px;

      display: grid;

      place-items: center;

      margin: 0 auto 30px;

      border-radius: 50%;

      background:
        rgba(34,211,163,.1);

      border:
        1px solid
        rgba(34,211,163,.3);

      color: #22d3a3;

      font-size: 35px;
    }

    h1 {

      font-size:
        clamp(40px, 7vw, 65px);

      line-height: 1;

      letter-spacing: -.06em;

      margin-bottom: 20px;
    }

    h1 span {

      color: #00ddff;

    }

    p {

      color: #8993a2;

      font-size: 17px;

      line-height: 1.8;

      margin-bottom: 35px;
    }

    .button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 50px;

      padding: 0 24px;

      border-radius: 8px;

      background: #00ddff;

      color: #001116;

      font-weight: 800;

      text-decoration: none;

      transition: .25s;
    }

    .button:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 30px
        rgba(0,221,255,.2);
    }

    .small {

      margin-top: 35px;

      font-size: 12px;

      color: #596270;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="logo">

      <div class="logo-mark">
        A
      </div>

      AZCODS<span>.</span>

    </div>


    <div class="check">
      ✓
    </div>


    <h1>
      Thank <span>you!</span>
    </h1>


    <p>

      Your enquiry has been received.

      We'll review your requirements and
      get back to you as soon as possible.

    </p>


    <a
      href="index.html"
      class="button"
    >
      ← Back to AZCODS
    </a>


    <div class="small">

      Software · AI · Digital Marketing

    </div>

  </div>

</body>

</html>
